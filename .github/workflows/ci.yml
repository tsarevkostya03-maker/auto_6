name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Start SUT
        run: |
          java -jar artifacts/app-replan-delivery.jar &
          sleep 10

      - name: Run tests
        run: mvn clean test

      - name: Stop SUT
        if: always()
        run: |
          pkill -f app-replan-delivery.jar || true