name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start SUT
        run: |
          java -jar ./artifacts/app-replan-delivery.jar &
          sleep 15

      - name: Run tests
        run: ./gradlew test --info -Dselenide.headless=true